# Explicit entrypoint for the existing BaseHTTPRequestHandler application.
# This resolves discovery only; see DEPLOYMENT.md for runtime requirements.
[project]
name = "shipment-studio"
version = "1.0.0"
description = "Excel shipment schedule extraction and review tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2,<3",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "ui_server:Handler"
